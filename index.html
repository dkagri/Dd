function loadHierarchy() {
  try {
    var s = localStorage.getItem(H_KEY);
    if (s) {
      var a = JSON.parse(s);
      if (Array.isArray(a) && a.length) return a;
    }
  } catch (e) {}
  return defaultHierarchy();
}

function saveHierarchy(h) { localStorage.setItem(H_KEY, JSON.stringify(h)); }
function getDivisionsForSub(subId) {
  var h = null, list = loadHierarchy();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === subId) h = list[i];
  }
  return h ? h.divisions : [];
}
function getOfficesForDiv(divName) {
  var h = loadHierarchy();
  for (var i = 0; i < h.length; i++) {
    for (var j = 0; j < h[i].divisions.length; j++) {
      if (h[i].divisions[j].name === divName) return h[i].divisions[j].offices;
    }
  }
  return [];
}

(function clearOldAutofill() {
  try {
    var em = document.getElementById('email'), pw = document.getElementById('password');
    if (em) em.value = '';
    if (pw) pw.value = '';
    setTimeout(function() {
      if (em) em.value = '';
      if (pw) pw.value = '';
    }, 600);
  } catch (e) {}
})();

function sessionHandoff() {
  try {
    var s = localStorage.getItem('fw_session') || '';
    return btoa(unescape(encodeURIComponent(s)));
  } catch (e) {
    return '';
  }
}

function redirectByRole(role) {
  var handoff = sessionHandoff();
  if (role === 'main_admin') {
    location.href = 'admin.html#fw=' + handoff;
  } else if (role === 'sub_admin') {
    location.href = 'subadmin.html#fw=' + handoff;
  } else {
    location.href = 'unit.html#fw=' + handoff;
  }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var rawInput = document.getElementById('email').value.trim();
  var loginId = rawInput.toLowerCase();
  var normalizedSlug = loginId.replace(/\//g, '.').replace(/\s+/g, '.').replace(/\.+/g, '.').replace(/[^a-z0-9._-]/g, '');
  var authEmail = loginId.indexOf('@') > -1 ? loginId : (normalizedSlug + '@agri.local');
  var pw = document.getElementById('password').value.trim();

  var err = document.getElementById('err');
  err.classList.add('hidden');
  var statusEl = document.getElementById('loginStatus');
  var btn = document.getElementById('loginBtn');
  if (statusEl) statusEl.textContent = 'Checking...';
  if (btn) btn.disabled = true;

  if (!supabaseClient) {
    err.textContent = 'Supabase Client load ஆகவில்லை. Internet இணைப்பைச் சரிபார்க்கவும்.';
    err.classList.remove('hidden');
    if (statusEl) statusEl.textContent = '';
    if (btn) btn.disabled = false;
    return;
  }

  try {
    var sbRes = await supabaseClient.auth.signInWithPassword({
      email: authEmail,
      password: pw
    });

    if (sbRes.error || !sbRes.data.user) {
      var msg = sbRes.error ? sbRes.error.message : 'Supabase Login Failed';
      err.textContent = 'පරිශීලක නාමය හෝ මුරපදය වැරදිය. (' + msg + ')';
      err.classList.remove('hidden');
      if (statusEl) statusEl.textContent = '';
      if (btn) btn.disabled = false;
      return;
    }

    var authUser = sbRes.data.user;

    // 1. Auth User ID மூலம் profiles-ஐத் தேடுதல்
    var profRes = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', authUser.id)
      .maybeSingle();

    // 2. கிடைக்காவிட்டால் username அல்லது email மூலம் தேடுதல்
    if (!profRes.data) {
      profRes = await supabaseClient
        .from('profiles')
        .select('*')
        .in('username', [loginId, rawInput, normalizedSlug, authEmail])
        .maybeSingle();
    }

    var p = profRes.data;
    if (!p) {
      err.textContent = 'Supabase Auth OK, නමුත් profiles Table එකේ ඔබේ Row එක නැත / RLS Block. Supabase Dashboard එකේ profiles වල Row එකක් එකතු කරන්න.';
      err.classList.remove('hidden');
      if (statusEl) statusEl.textContent = '';
      if (btn) btn.disabled = false;
      return;
    }

    if (p.status === 'inactive') {
      err.textContent = 'පරිශීලක අක්‍රීයයි (Inactive).';
      err.classList.remove('hidden');
      if (statusEl) statusEl.textContent = '';
      if (btn) btn.disabled = false;
      return;
    }

    var h = loadHierarchy();
    var subId = p.sub_office_id || p.subOfficeId || 'ALL';
    var so = null;
    for (var j = 0; j < h.length; j++) {
      if (h[j].id === subId) so = h[j];
    }

    var role = p.role || 'unit';
    var subName = p.sub_office_name || (so ? so.name : subId);
    var divName = p.division || '';
    var offName = p.office || '';

    localStorage.setItem('role', role);
    localStorage.setItem('user', p.username || loginId);
    localStorage.setItem('user_name', p.name || p.full_name || '');
    localStorage.setItem('user_subOfficeId', subId);
    localStorage.setItem('user_subOfficeName', subName);
    localStorage.setItem('user_division', divName);
    localStorage.setItem('user_office', offName);
    localStorage.setItem('user_officer_name', p.officer_name || '');
    localStorage.setItem('fw_session', JSON.stringify({
      user: p.username || loginId,
      role: role,
      subOfficeId: subId,
      subOfficeName: subName,
      division: divName,
      office: offName,
      exp: Date.now() + 12 * 60 * 60 * 1000
    }));

    redirectByRole(role);
  } catch (e2) {
    console.log('SB login error', e2);
    err.textContent = 'Supabase වෙත සම්බන්ධ විය නොහැක (' + (e2.message || 'Network Error') + ')';
    err.classList.remove('hidden');
    if (statusEl) statusEl.textContent = '';
    if (btn) btn.disabled = false;
  }
});

function continueLoggedIn() {
  try {
    var j = JSON.parse(localStorage.getItem('fw_session') || '{}');
    redirectByRole(j.role || 'unit');
  } catch (e) {
    location.href = 'unit.html';
  }
}

async function doLogout() {
  try {
    if (supabaseClient) await supabaseClient.auth.signOut();
  } catch (e) {}
  ['role', 'user', 'user_name', 'user_subOfficeId', 'user_subOfficeName', 'user_division', 'user_office', 'user_officer_name', 'fw_session'].forEach(function(k) {
    try { localStorage.removeItem(k); } catch (e) {}
  });
  location.reload();
}

function checkExistingSession() {
  try {
    var s = localStorage.getItem('fw_session');
    var box = document.getElementById('alreadyBox');
    if (!s) {
      if (box) box.classList.add('hidden');
      return;
    }
    var j = JSON.parse(s);
    if (j.exp && Date.now() > j.exp) {
      localStorage.removeItem('fw_session');
      if (box) box.classList.add('hidden');
      return;
    }
    if (box) {
      box.classList.remove('hidden');
      document.getElementById('alreadyWho').textContent = (j.user || '') + ' (' + (j.role || '') + ')';
    }
  } catch (e) {}
}

checkExistingSession();
